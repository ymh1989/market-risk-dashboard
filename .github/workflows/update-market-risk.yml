name: Update market risk data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-risk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize publication run
        run: |
          echo "MARKET_UPDATE_RUN_ID=gha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "MARKET_UPDATE_STARTED_AT=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore incremental index history cache
        uses: actions/cache@v4
        with:
          path: data/raw/index_history
          key: index-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            index-history-${{ runner.os }}-

      - name: Refresh market risk data
        run: |
          python3 -m m7_credit_proxy.pipeline --update-latest
          make update-market-risk
          make backtest-market-risk
          REFRESH_STRESS_CACHE=1 make analyze-stress-episodes
          python3 scripts/export_els_index_risk.py
          python3 scripts/export_hmm_regime.py

      - name: Refresh ML risk-off signal
        env:
          PYTHONWARNINGS: "ignore:Skipping features without any observed values:UserWarning"
          MPLCONFIGDIR: /tmp/market-lab-matplotlib
        run: |
          python3 -m kospi_risk.cli fetch-market-data --source-config configs/data_sources.yaml --output data/raw/market_data.csv --metadata data/raw/market_data_sources.json --min-rows 1500
          python3 -m kospi_risk.cli build-features --input data/raw/market_data.csv --output data/processed/features.parquet --config configs/base.yaml
          python3 -m kospi_risk.cli train --features data/processed/features.parquet --config configs/base.yaml
          python3 -m kospi_risk.cli backtest --features data/processed/features.parquet --config configs/base.yaml --output reports/backtest_report.md
          python3 -m kospi_risk.cli predict-latest --features data/processed/features.parquet --config configs/base.yaml --output reports/latest_signal.csv
          python3 scripts/export_ml_risk_signal.py

      - name: Validate dashboard data
        run: |
          python3 scripts/audit_data_completeness.py --strict
          make test
          COMPLETED_AT="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          python3 scripts/write_pipeline_status.py --mode full --run-id "$MARKET_UPDATE_RUN_ID" --started-at "$MARKET_UPDATE_STARTED_AT" --completed-at "$COMPLETED_AT"
          python3 scripts/export_offline_dashboard.py --stable-only
          python3 scripts/prepare_atomic_publication.py \
            --run-id "$MARKET_UPDATE_RUN_ID" \
            --mode full \
            --started-at "$MARKET_UPDATE_STARTED_AT" \
            --reused-file data/kospi-breadth.json
          python3 tests/smoke_test.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risk-dashboard.json data/market-risk-snapshot.json data/market-risk-timeseries.json data/naver-marketindex-history.json data/market-risk-backtest.json data/market-stress-episodes.json data/market-history-cache.json data/els-index-risk.json data/hmm-regime.json data/ml-risk-signal.json data/data-quality.json data/pipeline-status.json data/publication-manifest.json data/m7-credit-proxy.json data/kospi-breadth.json reports/market-risk-dashboard-offline.html
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update market risk data"
            git push
          fi
